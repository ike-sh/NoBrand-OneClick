name: NoBrand rc.4 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation dependencies on the ephemeral runner
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl ca-certificates git jq unzip openssl openssh-client python3 python3-yaml iproute2 util-linux tar coreutils shellcheck
      - name: Install pinned workflow validator
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: local
        run: |
          GOBIN="$RUNNER_TEMP/nobrand-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/nobrand-tools" >> "$GITHUB_PATH"
      - name: Validate frozen product, workflow, public artifacts and regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/ci-diagnostics.py run --evidence "$RUNNER_TEMP/nobrand-rc4"
      - name: Reject generated or other tracked file changes
        if: always()
        run: git diff --exit-code --quiet
      - name: Publish sanitized diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py publish --evidence "$RUNNER_TEMP/nobrand-rc4"
      - name: Upload sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: splicore-rc4-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/nobrand-rc4/public/summary.json
            ${{ runner.temp }}/nobrand-rc4/public/failure-summary.json
            ${{ runner.temp }}/nobrand-rc4/public/regression.sanitized.log
            ${{ runner.temp }}/nobrand-rc4/public/qualification-console.sanitized.log
            ${{ runner.temp }}/nobrand-rc4/public/command-diagnostics.sanitized.log
            ${{ runner.temp }}/nobrand-rc4/public/environment-summary.json
            ${{ runner.temp }}/nobrand-rc4/public/test-result-metadata.json
      - name: Propagate qualification exit status
        if: always()
        run: python3 scripts/ci-diagnostics.py finish --evidence "$RUNNER_TEMP/nobrand-rc4"
