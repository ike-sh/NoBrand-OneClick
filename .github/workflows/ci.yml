name: NoBrand CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, alpine:3.20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and unit tests
        run: |
          if [[ "${{ matrix.image }}" == alpine:* ]]; then
            setup='apk add --no-cache bash curl git jq unzip openssl openssh-keygen python3 iproute2 util-linux tar coreutils shellcheck'
          else
            setup='apt-get update && apt-get install -y bash curl ca-certificates git jq unzip openssl openssh-client python3 iproute2 util-linux tar coreutils shellcheck'
          fi
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" sh -lc "$setup && command -v ssh-keygen && git config --global --add safe.directory /work && bash scripts/test.sh"
          git diff --exit-code -- install-nobrand.sh dist/install-nobrand.sh

  mieru-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original Mieru isolated-v2 regression
        run: bash scripts/docker-smoke.sh
      - name: Debian Ubuntu Rocky Alpine platform matrix
        run: bash scripts/platform-smoke.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Real HY2 and VLESS FinalMask Xray data plane plus Surge Snell runtimes
        run: |
          # The suite mounts isolated filesystems and writes ip_forward inside
          # disposable network namespaces; Docker's default /proc/sys is read-only.
          docker run --rm --privileged -v "$PWD:/work" -w /work debian:12 sh -lc '
            apt-get update &&
            apt-get install -y bash curl ca-certificates git jq unzip openssl openssh-client openssh-server python3 iproute2 util-linux tar coreutils shellcheck libstdc++6 nftables procps &&
            command -v ssh-keygen && command -v sshd && command -v nft &&
            git config --global --add safe.directory /work &&
            bash scripts/test.sh --runtime
          '
